<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MKS SPORTS LIVE</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  
  <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

      html, body {
        margin: 0; padding: 0; background-color: #000;
        width: 100%; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif;
      }

      /* Clean Header */
      .app-header {
        position: absolute; top: 0; left: 0; width: 100%; height: 50px;
        background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px; box-sizing: border-box; z-index: 1000;
      }
      .brand-logo { color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 1px; }
      .brand-logo span { color: #0099ff; }
      
      .live-badge {
        background: #ef4444; color: white; font-size: 10px; font-weight: 700;
        padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
        animation: blink 2s infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

      /* Video Container */
      .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
      .shaka-video-container { width: 100%; height: 100%; }
      video { width: 100%; height: 100%; background: #000; outline: none; }

      /* HIDE THE BIG ANNOYING CENTER BUTTON */
      .shaka-play-button-container, .shaka-spinner-container { display: none !important; }

      /* UI Theme */
      .youtube-theme .shaka-bottom-controls { padding: 0; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); }
      .youtube-theme .shaka-controls-button-panel { height: 50px; padding: 0 15px; }
      .youtube-theme .shaka-played-range { background: #ef4444 !important; }
      
      /* =========================================
         CLEAN TELEGRAM BUTTON (NO WARNING ICON)
         ========================================= */
      .tg-floating-btn {
        position: fixed; top: 65px; right: 15px;
        background: #0088cc; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
        padding: 8px 15px; border-radius: 50px; font-size: 13px; font-weight: 700;
        text-decoration: none; display: flex; align-items: center; gap: 6px; z-index: 9999;
        box-shadow: 0 4px 15px rgba(0, 136, 204, 0.5); transition: 0.3s;
      }
      .tg-floating-btn svg { width: 16px; height: 16px; fill: #fff; }
      .tg-floating-btn:hover { background: #00aaff; transform: scale(1.05); }

      /* Premium Popup */
      .tg-popup-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
        z-index: 10000; display: none; justify-content: center; align-items: center;
      }
      .tg-popup-box {
        background: #111; border: 1px solid #0088cc; border-radius: 20px;
        padding: 30px 20px; width: 85%; max-width: 340px; text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9); position: relative;
      }
      .tg-popup-close { position: absolute; top: 10px; right: 15px; color: #888; font-size: 28px; cursor: pointer; text-decoration: none; }
      .tg-popup-title { color: #fff; font-size: 20px; font-weight: 900; margin-bottom: 10px; }
      .tg-popup-text { color: #aaa; font-size: 14px; margin-bottom: 20px; }
      .tg-popup-btn {
        background: #0088cc; color: #fff; text-decoration: none; padding: 12px 0; width: 100%;
        border-radius: 10px; font-size: 15px; font-weight: 700; display: inline-flex; justify-content: center; align-items: center; gap: 8px;
      }
  </style>
</head>
<body>

  <!-- Clean Floating Telegram Button -->
  <a href="https://t.me/MKSsports_3" target="_blank" class="tg-floating-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.83l7.65 13.17H4.35L12 5.83zM11 16h2v2h-2v-2zm0-7h2v5h-2V9z"/></svg>
    JOIN TELEGRAM
  </a>

  <!-- Popup -->
  <div class="tg-popup-overlay" id="tgPopup">
    <div class="tg-popup-box">
      <a href="#" class="tg-popup-close" onclick="closePopup(); return false;">&times;</a>
      <div class="tg-popup-title">🔥 GET FREE LINKS</div>
      <div class="tg-popup-text">Join our Telegram channel for daily Live Match Links. No Ads, No Buffering!</div>
      <a href="https://t.me/MKSsports_3" target="_blank" class="tg-popup-btn" onclick="closePopup()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.83l7.65 13.17H4.35L12 5.83zM11 16h2v2h-2v-2zm0-7h2v5h-2V9z"/></svg>
        JOIN NOW
      </a>
    </div>
  </div>

  <div class="app-header" id="header-bar">
    <div class="brand-logo">MKS <span>SPORTS</span></div>
    <div class="live-badge">LIVE</div>
  </div>

  <div class="video-container" id="player-box">
    <div class="shaka-video-container youtube-theme" data-shaka-player>
      <video id="video" autoplay playsinline preload="auto"></video>
    </div>
  </div>



  <script>
    // Popup logic
    window.onload = () => { setTimeout(() => { document.getElementById('tgPopup').style.display = 'flex'; }, 2000); };
    function closePopup() { document.getElementById('tgPopup').style.display = 'none'; }

    // Dual Parser
    function parseEngine() {
      let rawUrl = window.location.href;
      try { rawUrl = decodeURIComponent(rawUrl); } catch (e) {}

      let streamUrl = "";
      let clearKeys = {};
      let cookie = "";

      const qIndex = rawUrl.indexOf('?');
      if (qIndex === -1) {
        return {
          streamUrl: sessionStorage.getItem('mks_url') || "",
          clearKeys: JSON.parse(sessionStorage.getItem('mks_keys') || "{}"),
          cookie: sessionStorage.getItem('mks_cookie') || ""
        };
      }

      let queryPart = rawUrl.substring(qIndex + 1);

      if (queryPart.includes('|drmScheme=')) {
        let parts = queryPart.split('|');
        streamUrl = parts[0];
        if (streamUrl.startsWith('url=')) streamUrl = streamUrl.substring(4);
        
        let drmPart = parts[1];
        if (drmPart && drmPart.includes('drmLicense=')) {
          let licenseStr = drmPart.split('drmLicense=')[1].split('&')[0];
          let keyPairs = licenseStr.split(','); 
          keyPairs.forEach(pair => {
            let kp = pair.split(':');
            if (kp.length === 2) { clearKeys[kp[0].trim()] = kp[1].trim(); }
          });
        }
        
        const tokenMatch = streamUrl.match(/[&?](token=[^#\s]+)/i) || streamUrl.match(/(&__hdnea__=[^#\s]+)/i) || streamUrl.match(/(\?__hdnea__=[^#\s]+)/i);
        if (tokenMatch) {
            cookie = tokenMatch[1].replace(/^[&?]/, '').replace('__hdnea__=', '');
            streamUrl = streamUrl.split('?__hdnea__=')[0].split('&__hdnea__=')[0];
        }
      } 
      else {
        const urlParams = new URLSearchParams(window.location.search);
        streamUrl = urlParams.get('url');
        
        let kId = urlParams.get('keyId');
        let k = urlParams.get('key');
        if (kId && k) clearKeys[kId] = k;
        
        cookie = urlParams.get('token');
        
        if (!cookie && streamUrl) {
           const tokenMatch = streamUrl.match(/[&?](token=[^#\s]+)/i) || streamUrl.match(/(&__hdnea__=[^#\s]+)/i) || streamUrl.match(/(\?__hdnea__=[^#\s]+)/i);
           if (tokenMatch) {
              cookie = tokenMatch[1].replace(/^[&?]/, '').replace('__hdnea__=', '');
              streamUrl = streamUrl.split('?__hdnea__=')[0].split('&__hdnea__=')[0];
           }
        }
      }

      if (streamUrl) {
        sessionStorage.setItem('mks_url', streamUrl);
        sessionStorage.setItem('mks_keys', JSON.stringify(clearKeys));
        sessionStorage.setItem('mks_cookie', cookie || "");
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      return { streamUrl, clearKeys, cookie };
    }

    const { streamUrl, clearKeys, cookie } = parseEngine();
    const video = document.getElementById('video');

    async function initializePlayer() {
      if (!streamUrl) return;

      try {
        shaka.polyfill.installAll();
        const player = new shaka.Player();
        await player.attach(video);

        const container = document.querySelector('.shaka-video-container');
        const ui = new shaka.ui.Overlay(player, container, video);
        
        // 🔥 MAGIC HERE: addBigPlayButton: false Hides the annoying center button!
        ui.configure({
          'addBigPlayButton': false, 
          'seekBarColors': { base: 'rgba(255,255,255,.2)', buffered: 'rgba(255,255,255,.5)', played: '#ef4444' },
          'controlPanelElements': ['play_pause', 'mute', 'time_and_duration', 'spacer', 'quality', 'fullscreen']
        });

        // 🔥 5-SECOND DELAY TO STOP BUFFERING 🔥
        const playerConfig = { 
            streaming: { 
                safeSeekOffset: 5,        // Keeps stream exactly 5 seconds behind live
                bufferingGoal: 30,        // Loads 30 seconds ahead
                rebufferingGoal: 2,       
                lowLatencyMode: false     // Focus on smoothness
            }
        };
        
        if (Object.keys(clearKeys).length > 0) { playerConfig.drm = { clearKeys: clearKeys }; }
        player.configure(playerConfig);

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
          if (streamUrl.includes('jio.com')) {
              request.headers['Referer'] = 'https://www.jiotv.com/';
              request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
              if (cookie && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
                const baseUri = request.uris[0].split('?')[0];
                request.uris[0] = baseUri + '?' + '__hdnea__=' + cookie;
              }
          }
        });

        video.autoplay = true;
        video.muted = false;
        await player.load(streamUrl);
        video.play().catch(e => console.log("Autoplay blocked by browser."));

      } catch (error) {
        console.error('Error:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initializePlayer);
  </script>
</body>
</html>
