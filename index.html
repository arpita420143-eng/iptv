<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS SPORTS - Ultra Premium Player</title>
    
    <!-- Modern Tech Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Jura:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --primary-accent: #00e5ff; /* Cyan/Teal - Premium Tech Vibe */
            --secondary-accent: #111;
            --bg-deep: #0a0b10;
            --glass-bg: rgba(16, 18, 27, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            /* Subtle radial gradient behind the player */
            background-image: radial-gradient(circle at 50% 40%, rgba(0, 229, 255, 0.1) 0%, transparent 60%);
            color: #fff;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* PREMIUM HEADER */
        header {
            width: 100%;
            padding: 30px 0 10px 0;
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-family: 'Jura', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 8px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            background: linear-gradient(90deg, #fff, var(--primary-accent), #fff);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        /* --- THE ULTIMATE PLAYER CONTAINER --- */
        .player-showcase {
            width: 95%;
            max-width: 1100px; /* Big screen size */
            margin-top: 20px;
            position: relative;
            z-index: 10;
            /* Premium Glassmorphism Container */
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8), /* Deep drop shadow */
                inset 0 1px 1px rgba(255,255,255,0.1), /* Top highlight */
                0 0 0 1px rgba(0, 229, 255, 0.2); /* Subtle glow border */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Glowing back-panel effect for the player */
        .player-showcase::before {
            content: '';
            position: absolute;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
            border-radius: 30px;
            pointer-events: none;
        }

        .video-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            position: relative;
        }

        /* --- CUSTOMIZING PLYR CONTROLS --- */
        /* Overriding default Plyr styles to look like Netflix/Hotstar but better */
        
        /* Change Main Color to Cyan */
        --plyr-color-main: var(--primary-accent);
        
        /* Transparent Black Gradient for Controls */
        .plyr__controls {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, transparent 100%) !important;
            padding-bottom: 20px !important;
            padding-top: 40px !important;
        }

        /* Make Play/Pause Button a Circle like Netflix */
        .plyr__control--overlaid {
            background: rgba(0, 229, 255, 0.8) !important;
            box-shadow: 0 0 20px var(--primary-accent) !important;
            backdrop-filter: blur(5px);
        }

        /* Progress bar styling */
        .plyr input[type=range]::-webkit-slider-thumb {
            box-shadow: 0 0 10px var(--primary-accent);
        }

        /* Menu styling (Settings/Quality) */
        .plyr__menu__container {
            background: rgba(10, 11, 16, 0.95) !important;
            border: 1px solid rgba(0, 229, 255, 0.3) !important;
            border-radius: 10px !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
        }
        
        .plyr__menu__container .plyr__control {
            font-family: 'Exo 2', sans-serif !important;
            color: #fff !important;
        }
        
        .plyr__menu__container .plyr__control[aria-checked=true]::before {
            background: var(--primary-accent) !important;
        }

        /* --- STREAM STATS (Minimalist) --- */
        .stream-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 10px;
            font-family: 'Jura', sans-serif;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
        }
        
        .live-badge {
            display: flex;
            align-items: center;
            color: #ff0055;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .live-badge::before {
            content: '';
            display: inline-block;
            width: 8px; height: 8px;
            background: #ff0055;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #ff0055;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        /* --- PREMIUM POPUP MODAL --- */
        .premium-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-content {
            background: linear-gradient(145deg, #161823, #0d0f17);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(0, 229, 255, 0.1);
            position: relative;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Jura', sans-serif;
            color: var(--primary-accent);
            margin-top: 0;
            font-size: 1.8rem;
        }

        .modal-content p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-telegram {
            background: linear-gradient(90deg, #0088cc, #00e5ff);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.4);
            transition: 0.3s;
        }

        .btn-telegram:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.6);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover { color: #fff; }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .player-showcase { padding: 10px; width: 100%; border-radius: 0; border: none; }
            .video-wrapper { border-radius: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MKS SPORTS</h1>
    </header>

    <!-- The Star of the Show: Player Container -->
    <div class="player-showcase">
        <div class="video-wrapper">
            <video id="player" controls crossorigin playsinline></video>
        </div>
        
        <!-- Minimalist Stats under player -->
        <div class="stream-stats">
            <div class="live-badge">LIVE</div>
            <div>RES: AUTO / HLS</div>
            <div>SERVER: OP-1</div>
        </div>
    </div>

    <!-- Premium Modal Popup -->
    <div class="premium-modal" id="tgModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">✖</span>
            <h2>UNLOCK VIP ACCESS</h2>
            <p>Join the official MKS Sports Telegram channel to get ad-free links, 4K streams, and instant server updates.</p>
            <a href="https://t.me/MKSsports_3" target="_blank" class="btn-telegram">JOIN TELEGRAM</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            // Premium Plyr configuration
            const playerConfig = {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'live', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                tooltips: { controls: true, seek: true } // Hover tooltips
            };

            // HLS Implementation for seamless quality switching
            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                    enableWorker: true // Better performance
                });
                
                hls.loadSource(source);

                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    const availableQualities = hls.levels.map((l) => l.height);
                    availableQualities.unshift(0); // Add Auto option

                    playerConfig.quality = {
                        default: 0,
                        options: availableQualities,
                        forced: true,
                        onChange: (e) => updateQuality(e),
                    };

                    new Plyr(video, playerConfig);
                });

                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                new Plyr(video, playerConfig);
            }

            function updateQuality(newQuality) {
                if (newQuality === 0) {
                    window.hls.currentLevel = -1; 
                } else {
                    window.hls.levels.forEach((level, levelIndex) => {
                        if (level.height === newQuality) {
                            window.hls.currentLevel = levelIndex;
                        }
                    });
                }
            }

            // Show Popup after 6 seconds
            setTimeout(() => {
                document.getElementById('tgModal').style.display = 'flex';
            }, 6000);
        });

        function closeModal() {
            document.getElementById('tgModal').style.display = 'none';
        }
    </script>

</body>
</html>
