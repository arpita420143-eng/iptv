<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS sports</title>
    
    <!-- hls.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        video {
            width: 100%;
            display: block;
        }
        .controls {
            padding: 10px 15px;
            background: #222;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            color: #fff;
        }
        .controls label {
            margin-right: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .controls select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Video Element -->
        <video id="my-video" controls autoplay muted></video>
        
        <!-- Quality Control Dropdown -->
        <div class="controls">
            <label for="quality">Video Quality: </label>
            <select id="quality">
                <option value="-1">Auto</option>
            </select>
        </div>
    </div>

    <script>
        var video = document.getElementById('my-video');
        var qualitySelector = document.getElementById('quality');
        var streamUrl = 'https://tvsen6.aynaott.com/zv68oqPDu7MZZwmHhRxt/tracks-v1a1/mono.ts.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            // Jab stream ka data (manifest) load ho jaye
            hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                // Available quality levels ko dropdown me add karna
                var availableQualities = hls.levels;
                
                availableQualities.forEach(function(level, index) {
                    var option = document.createElement('option');
                    option.value = index; // Hls.js me level ka index use hota hai
                    option.text = level.height + 'p'; // Jaise 720p, 1080p
                    qualitySelector.appendChild(option);
                });

                video.play();
            });

            // Jab user dropdown se quality change kare
            qualitySelector.addEventListener('change', function() {
                var selectedQuality = parseInt(this.value);
                hls.currentLevel = selectedQuality; // -1 means Auto, otherwise level index
            });
        } 
        // Apple devices ke liye (iOS Safari me direct switch native player me hota hai)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
            // Native player hone ki wajah se custom dropdown hide kar denge
            document.querySelector('.controls').style.display = 'none';
        }
    </script>

</body>
</html>
