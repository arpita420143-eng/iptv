<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS SPORTS | Premium Streaming</title>
    <style>
        /* Modern Reset & Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Premium Glassmorphism Header */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 3px solid #ff8c00;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .navbar h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
        }

        /* Main Content Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        /* Premium Video Card */
        .video-card {
            position: relative;
            background: #1a1d24;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 140, 0, 0.3), 0 0 15px rgba(10, 37, 71, 0.5);
            border-color: rgba(255, 140, 0, 0.5);
            z-index: 10;
        }

        /* Iframe Styling */
        .video-card iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
            background: #000;
        }

        /* Live Badge Animation */
        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e50914;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 4px;
            letter-spacing: 1px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
            pointer-events: none;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        /* Card Info Bar */
        .card-info {
            padding: 15px 20px;
            background: linear-gradient(to top, #1a1d24, rgba(26, 29, 36, 0.9));
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: #8892b0;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .navbar h1 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            .video-grid {
                gap: 25px;
            }
            .container {
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>

    <!-- Premium Header -->
    <header class="navbar">
        <h1>MKS SPORTS</h1>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="section-title">
            <span style="color: #ff8c00;">▶</span> Live Events Now
        </div>

        <div class="video-grid">
            
            <!-- Stream Card 1 (Updated Link with No Logo settings) -->
            <div class="video-card">
                <div class="live-badge">
                    <div class="live-dot"></div> LIVE
                </div>
                <!-- modestbranding=1 (hides youtube logo), rel=0 (hides related videos), iv_load_policy=3 (hides annotations) -->
                <iframe 
                    src="https://www.youtube.com/embed/SEehSGaEfGY?autoplay=1&mute=1&modestbranding=1&rel=0&iv_load_policy=3&showinfo=0" 
                    title="MKS Sports Live 1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
                <div class="card-info">
                    <div class="card-title">Live Stream 1 - Watch Now</div>
                    <div class="card-subtitle">MKS Sports Exclusive Broadcasting</div>
                </div>
            </div>

            <!-- Stream Card 2 (Added No Logo settings yahan bhi) -->
            <div class="video-card">
                <div class="live-badge">
                    <div class="live-dot"></div> LIVE
                </div>
                <iframe 
                    src="https://www.youtube.com/embed/v6vTLS4MfCU?autoplay=1&mute=1&modestbranding=1&rel=0&iv_load_policy=3&showinfo=0" 
                    title="MKS Sports Live 2" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
                <div class="card-info">
                    <div class="card-title">Live Stream 2 - Multi-cam View</div>
                    <div class="card-subtitle">MKS Sports Exclusive Broadcasting</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
