<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKS Sports | Live Streaming</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 12px;
      text-align: center;
      background: #101827;
      border-bottom: 3px solid #f5b942;
    }

    header h1 {
      margin: 0;
      color: #f5b942;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .player-card {
      padding: 18px;
      background: #111827;
      border: 1px solid #293548;
      border-radius: 14px;
      box-shadow: 0 8px 30px #0007;
    }

    .live-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 20px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 9px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status {
      margin: 14px 2px 0;
      color: #cbd5e1;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 45px;
      padding: 22px 10px;
      text-align: center;
      color: #778399;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        margin: 18px auto;
        padding: 0 10px;
      }
      .player-card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MKS SPORTS</h1>
  <p>Your Sports Streaming Hub</p>
</header>

<main>
  <section class="player-card">

    <h2 class="live-heading">
      <span class="live-dot"></span>
      Live Sports
    </h2>

    <div class="video-box" data-shaka-player-container>
      <video
        id="videoPlayer"
        data-shaka-player
        playsinline
        autoplay
        controls>
      </video>
    </div>

    <div id="status" role="status" aria-live="polite">
      Initializing player...
    </div>

  </section>
</main>

<footer>
  MKS Sports &copy; 2026
</footer>

<script>
  const STREAM_URL = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd";

  const CLEAR_KEYS = {
    "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b"
  };

  async function initPlayer() {
    const status = document.getElementById("status");
    const video = document.getElementById("videoPlayer");

    try {
      if (!window.shaka) {
        throw new Error("Player library failed to load. Check your internet connection.");
      }

      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        throw new Error("This browser does not support Shaka Player.");
      }

      // Shaka UI ke sath properly player create karna
      const ui = video['ui'];
      const player = ui.getPlayer();

      player.addEventListener("error", event => {
        const error = event.detail;
        console.error("Shaka playback error:", error);
        status.textContent = "Playback error: " + (error.message || "Check the browser console.") + " Error code: " + error.code;
      });

      // ClearKey DRM setup
      player.configure({
        drm: {
          clearKeys: CLEAR_KEYS
        }
      });

      status.textContent = "Connecting to stream...";

      await player.load(STREAM_URL);
      status.textContent = "Stream loaded successfully!";

    } catch (error) {
      console.error("Player setup error:", error);
      status.textContent = "Unable to play: " + (error.message || "Unknown error.");
    }
  }

  document.addEventListener("DOMContentLoaded", initPlayer);
</script>

</body>
</html>
