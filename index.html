<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS SPORTS - HOTSTAR KILLER</title>

    <!-- Sci-Fi & Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --cyan: #00f3ff;
            --magenta: #ff0055;
            --dark-bg: #050505;
            --glass-bg: rgba(10, 10, 15, 0.6);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. HACKING BOOT SEQUENCE --- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10%;
            font-family: 'Space Mono', monospace;
            color: var(--cyan);
            transition: opacity 0.8s ease-out;
        }

        .boot-text { font-size: 1.2rem; text-shadow: 0 0 5px var(--cyan); }

        /* --- 2. PREMIUM APP LAYOUT --- */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s forwards 4s; /* Waits for boot sequence */
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Glassmorphism Header */
        header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            position: fixed;
            top: 0; z-index: 100;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(90deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            letter-spacing: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--magenta);
            padding: 6px 15px;
            border-radius: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--magenta);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .status-badge span {
            width: 8px; height: 8px;
            background: var(--magenta);
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 3. THE HOTSTAR-KILLER PLAYER SECTION --- */
        .player-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 70px; /* Header height */
            padding: 20px;
            background: radial-gradient(circle at center, #111 0%, var(--dark-bg) 100%);
        }

        .player-wrapper {
            width: 100%;
            max-width: 1200px; /* Cinematic size */
            position: relative;
            border-radius: 16px;
            /* Animated Cyber Border */
            background: linear-gradient(45deg, var(--cyan), transparent, var(--magenta), transparent);
            background-size: 400% 400%;
            animation: gradientBorder 5s ease infinite;
            padding: 2px; /* Border thickness */
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 243, 255, 0.1);
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-container {
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        /* --- 4. HUD (REFINED FOR PERFECT OVERLAP) --- */
        .hud-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            padding: 15px;
            font-family: 'Space Mono', monospace;
            color: rgba(0, 243, 255, 0.5); /* Subtle cyan text */
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px #000; /* Contrast against bright video */
        }

        .hud-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 50%;
        }

        /* --- 5. ULTRA-PREMIUM PLYR CONTROLS --- */
        --plyr-color-main: var(--cyan);
        .plyr__controls {
            /* Frosted glass background for controls! */
            background: rgba(10, 15, 25, 0.4) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 15px !important;
        }
        
        /* Netflix style red progress bar option (using cyan here for sci-fi theme) */
        .plyr input[type=range]::-webkit-slider-thumb {
            box-shadow: 0 0 10px var(--cyan) !important;
        }

        .plyr__control--overlaid {
            background: rgba(0, 243, 255, 0.2) !important;
            backdrop-filter: blur(5px);
            border: 1px solid var(--cyan) !important;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4) !important;
        }

        .plyr__menu__container {
            background: rgba(10, 15, 25, 0.85) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.2) !important;
            border-radius: 12px !important;
        }

        /* --- 6. SLEEK TELEGRAM WIDGET --- */
        .tg-banner {
            position: fixed;
            bottom: -100px; /* Hidden initially */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--cyan);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2);
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tg-banner.show { bottom: 30px; }

        .tg-text h3 { margin: 0; color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 1rem; }
        .tg-text p { margin: 5px 0 0 0; font-size: 0.8rem; color: #ccc; }

        .tg-btn {
            background: linear-gradient(45deg, var(--cyan), #0088cc);
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            header { padding: 10px 15px; }
            header h1 { font-size: 1.5rem; }
            .player-section { padding: 0; margin-top: 60px; align-items: flex-start; }
            .player-wrapper { border-radius: 0; padding: 0; border-top: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan); animation: none; background: #000; }
            .video-container { border-radius: 0; }
            .tg-banner { flex-direction: column; text-align: center; gap: 10px; padding: 15px; }
            .tg-banner.show { bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- BOOT SEQUENCE -->
    <div id="boot-screen">
        <div class="boot-text" id="terminal"></div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        
        <header>
            <h1>MKS SPORTS</h1>
            <div class="status-badge"><span></span> LIVE STREAM</div>
        </header>

        <div class="player-section">
            <div class="player-wrapper">
                <div class="video-container">
                    
                    <!-- HUD OVERLAY (Perfectly scaled) -->
                    <div class="hud-layer">
                        <div class="hud-top">
                            <div>SYS: ORBITAL-V2<br>LAT: 28.61° N</div>
                            <div style="text-align: right;">[REC]<br>PING: 12ms</div>
                        </div>
                        <div class="hud-center"></div>
                    </div>

                    <!-- VIDEO PLAYER -->
                    <video id="player" controls crossorigin playsinline></video>
                </div>
            </div>
        </div>

        <!-- TELEGRAM BANNER -->
        <div class="tg-banner" id="tgBanner">
            <div class="tg-text">
                <h3>VIP ACCESS</h3>
                <p>Join Telegram for 4K links & Backup Servers.</p>
            </div>
            <a href="https://t.me/MKSsports_3" target="_blank" class="tg-btn">JOIN NOW</a>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // --- 1. BOOT SEQUENCE SCRIPT ---
        const terminalText = [
            "> INIT MKS PROTOCOL...",
            "> BYPASSING SECURE NODES...",
            "> ESTABLISHING SAT-LINK...",
            "> DECRYPTING STREAM...",
            "> ACCESS GRANTED."
        ];
        
        let lineIndex = 0;
        const terminal = document.getElementById('terminal');

        function typeLine() {
            if (lineIndex < terminalText.length) {
                terminal.innerHTML += terminalText[lineIndex] + "<br>";
                lineIndex++;
                setTimeout(typeLine, 400); 
            } else {
                setTimeout(() => {
                    document.getElementById('boot-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 800);
                }, 500);
            }
        }
        window.onload = typeLine;

        // --- 2. PLAYER SETUP ---
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            const playerConfig = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'live', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 1, 1.5, 2] }
            };

            if (Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 60, maxMaxBufferLength: 1200 });
                hls.loadSource(source);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels.map(l => l.height);
                    availableQualities.unshift(0); 
                    playerConfig.quality = { default: 0, options: availableQualities, forced: true, onChange: (e) => updateQuality(e) };
                    new Plyr(video, playerConfig);
                });
                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                new Plyr(video, playerConfig);
            }

            function updateQuality(newQuality) {
                if (newQuality === 0) window.hls.currentLevel = -1; 
                else window.hls.levels.forEach((level, index) => { if (level.height === newQuality) window.hls.currentLevel = index; });
            }

            // Show Telegram Banner after 8 seconds
            setTimeout(() => {
                document.getElementById('tgBanner').classList.add('show');
            }, 8000);
        });
    </script>

</body>
</html>
