<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  
  <!-- Shaka Player UI Styles and Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

  <!-- Plyr & HLS.js Styles and Scripts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
  
  <style type="text/css">
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 400;
        src: url(https://fonts.gstatic.com/s/roboto/v27/KFOmCnqEu92Fr1Me5Q.ttf) format('truetype');
      }

      html, body {
        margin: 0; padding: 0; background-color: #000000; width: 100%; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif;
      }

      .error-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 100%; background-color: #ffffff; color: #000000; text-align: center;
      }
      .error-container h1 { font-size: 90px; margin: 0; color: #707070; font-weight: 300; }
      .error-container h2 { font-size: 24px; margin: 10px 0; color: #222222; }
      .error-container p { font-size: 14px; color: #666666; margin-bottom: 20px; }
      .error-container a { font-size: 14px; color: #1a73e8; text-decoration: none; }

      .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; overflow: hidden; }
      .shaka-video-container, .plyr, iframe { position: absolute; width: 100%; height: 100%; border: none; background: #000; }
      video { width: 100%; height: 100%; background-color: #000000; }

      .youtube-theme { font-family: 'Roboto', sans-serif; }
      .youtube-theme .shaka-bottom-controls { width: 100%; padding: 0; z-index: 1; display: flex; flex-direction: column; }
      .youtube-theme .shaka-controls-button-panel { order: 2; height: 60px; padding: 0 10px; }
      .youtube-theme .shaka-seek-bar-container { height: 3px; }
      .youtube-theme .shaka-seek-bar-container:hover { height: 5px; cursor: pointer; }
      
      .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
      .youtube-theme .shaka-seek-bar { background: rgba(255,255,255,.2) !important; }
      .youtube-theme .shaka-buffered-range { background: rgba(255,255,255,.4) !important; }
      .youtube-theme .shaka-played-range { background: rgb(255,0,0) !important; }
  </style>
</head>

<body>
  <div id="error-box" class="error-container" style="display: none;">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The requested URL or stream is invalid.</p>
    <a href="#" onclick="window.location.reload(); return false;">← Try Again</a>
  </div>

  <div class="video-container" id="player-box" style="display: none;">
    <div class="shaka-video-container youtube-theme" data-shaka-player>
      <video id="video" autoplay muted playsinline preload="auto"></video>
    </div>
  </div>





 <script>
    function parseEngine() {
      let raw = window.location.href;
      for (let i = 0; i < 3; i++) {
        try {
          if (raw.includes('%')) raw = decodeURIComponent(raw);
        } catch (e) { break; }
      }

      let streamUrl = "";
      let clearKeys = {};
      let cookie = "";

      const qIndex = raw.indexOf('?');
      if (qIndex === -1) return { streamUrl, clearKeys, cookie };

      let queryPart = raw.substring(qIndex + 1);
      let matchHttp = queryPart.match(/(?:url=)?(https?:\/\/[^\s]+)/i);
      if (!matchHttp) return { streamUrl, clearKeys, cookie };

      let fullExtracted = matchHttp[1];

      if (fullExtracted.includes('.m3u8')) {
        streamUrl = fullExtracted;
      } 
      else if (fullExtracted.includes('.mpd')) {
        const mpdIndex = fullExtracted.indexOf('.mpd');
        streamUrl = fullExtracted.substring(0, mpdIndex + 4);
        let afterStream = fullExtracted.substring(mpdIndex + 4);

        const tokenMatch = afterStream.match(/[&?](token=[^#\s]+)/i) || afterStream.match(/(&hdnea=[^#\s]+)/i);
        if (tokenMatch) {
          cookie = tokenMatch[1].replace(/^[&?]/, '');
          afterStream = afterStream.replace(tokenMatch[0], '');
        } else if (afterStream.includes('&')) {
          const parts = afterStream.split('&');
          afterStream = parts[0];
          if (parts.length > 1) { cookie = parts.slice(1).join('&'); }
        }

        const cleanHex = afterStream.replace(/0x/gi, '').replace(/([a-f0-9]{8})-([a-f0-9]{4})-([a-f0-9]{4})-([a-f0-9]{4})-([a-f0-9]{12})/gi, '$1$2$3$4$5');
        const gluedMatch = cleanHex.match(/[?&#/|;:=_-]?([a-fA-F0-9]{64})/i);
        if (gluedMatch) {
          const hex = gluedMatch[1];
          clearKeys[hex.substring(0, 32).toLowerCase()] = hex.substring(32, 64).toLowerCase();
          clearKeys[hex.substring(32, 64).toLowerCase()] = hex.substring(0, 32).toLowerCase();
        }

        const hexFound = cleanHex.match(/[a-fA-F0-9]{32}/g) || [];
        if (hexFound.length >= 2) {
          for (let i = 0; i < hexFound.length - 1; i += 2) {
            const k1 = hexFound[i].toLowerCase();
            const k2 = hexFound[i + 1].toLowerCase();
            clearKeys[k1] = k2;
            clearKeys[k2] = k1;
          }
        }
      } else {
        streamUrl = fullExtracted;
      }

      return { streamUrl, clearKeys, cookie };
    }

    let player = null;

    async function initializePlayer(targetStreamUrl, targetClearKeys = {}, targetCookie = "") {
      try {
        const video = document.getElementById('video');
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          throw new Error('Browser not supported by Shaka Player');
        }

        if (window.player) {
          await window.player.destroy();
          window.player = null;
        }

        player = new shaka.Player();
        window.player = player;
        await player.attach(video);

        const container = document.querySelector('.shaka-video-container');
        const existingUI = container.querySelector('.shaka-controls');
        if (existingUI) { existingUI.remove(); }

        const ui = new shaka.ui.Overlay(player, container, video);
        
        ui.configure({
          'seekBarColors': { base: 'rgba(255,255,255,.2)', buffered: 'rgba(255,255,255,.4)', played: 'rgb(255,0,0)' },
          'controlPanelElements': ['play_pause', 'mute', 'time_and_duration', 'restart', 'spacer', 'quality', 'language', 'picture_in_picture', 'fullscreen', 'overflow_menu']
        });

        const playerConfig = {
          streaming: { bufferingGoal: 10, rebufferingGoal: 2, bufferBehind: 30, lowLatencyMode: true },
          manifest: {
            retryParameters: { timeout: 30000, maxAttempts: 3, baseDelay: 1000, backoffFactor: 2, fuzzFactor: 0.5 },
            dash: { ignoreMinBufferTime: true }
          }
        };

        if (Object.keys(targetClearKeys).length > 0) {
          playerConfig.drm = { clearKeys: targetClearKeys };
        }

        player.configure(playerConfig);

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
          request.headers['Referer'] = 'https://www.jiotv.com/';
          request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';

          if (targetCookie && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
            const baseUri = request.uris[0].split('?')[0];
            request.uris[0] = baseUri + '?' + targetCookie;
          }
        });

        video.autoplay = true;
        video.controls = false;
        video.volume = 1;
        video.muted = false;
        video.preload = 'auto';

        await player.load(targetStreamUrl);

        const attemptAutoplay = async () => {
          try { await video.play(); } 
          catch (e) {
            video.muted = true;
            try { await video.play(); } catch (err) {}
          }
        };

        if (video.readyState >= 2) {
          await attemptAutoplay();
        } else {
          video.addEventListener('canplay', attemptAutoplay, { once: true });
        }

      } catch (error) {
        console.error('Error initializing player:', error);
        const video = document.getElementById('video');
        video.src = targetStreamUrl;
        video.autoplay = true;
        try { await video.play(); } catch (e) { video.muted = true; video.play(); }
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Check if URL has query parameters
      if (!window.location.search || window.location.search.length <= 1) {
        document.getElementById('error-box').style.display = 'flex';
        document.getElementById('player-box').style.display = 'none';
        return;
      }

      document.getElementById('error-box').style.display = 'none';
      document.getElementById('player-box').style.display = 'block';

      // Parse the stream URL, DRM keys, and cookies directly from the URL
      const { streamUrl, clearKeys, cookie } = parseEngine();
      
      if (streamUrl) {
        initializePlayer(streamUrl, clearKeys, cookie);
      } else {
        document.getElementById('error-box').style.display = 'flex';
        document.getElementById('player-box').style.display = 'none';
      }
    });
  </script>
</body>
</html>
