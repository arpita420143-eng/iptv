<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MKS sports | Live Streaming</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c14;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #101827;
      border-bottom: 2px solid #f5b942;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      color: #f5b942;
      letter-spacing: 1px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 1050px;
      margin: 25px auto;
      padding: 0 12px;
    }

    .player-card {
      padding: 12px;
      background: #111827;
      border: 1px solid #273449;
      border-radius: 12px;
      box-shadow: 0 8px 30px #0008;
    }

    .live-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 4px 0 14px;
      font-size: 17px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 8px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status {
      margin: 12px 2px 3px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MKS SPORTS</h1>
    <p>Your Sports Streaming Hub</p>
  </header>

  <main>
    <section class="player-card">

      <div class="live-title">
        <span class="live-dot"></span>
        <span>Live Sports</span>
      </div>

      <div class="video-container"
           data-shaka-player-container>

        <video
          id="videoPlayer"
          data-shaka-player
          playsinline
          controls>
        </video>

      </div>

      <div id="status" role="status" aria-live="polite">
        Initializing player...
      </div>

    </section>
  </main>

  <footer>
    MKS Sports &copy; 2026
  </footer>

  <script>
    const STREAM_URL = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd";

    async function initPlayer() {
      const status = document.getElementById("status");

      try {
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
          throw new Error(
            "Your browser does not support this player."
          );
        }

        const video = document.getElementById("videoPlayer");

        // Create player and attach it to the video.
        const player = new shaka.Player();

        await player.attach(video);

        player.addEventListener("error", (event) => {
          console.error("Shaka Player error:", event.detail);

          status.textContent =
            "Playback error. Check the browser console.";
        });

        // Load an authorized DASH stream.
        await player.load(STREAM_URL);

        status.textContent = "Stream loaded successfully.";

      } catch (error) {
        console.error("Player initialization failed:", error);

        status.textContent =
          "Unable to play the stream: " + error.message;
      }
    }

    document.addEventListener("DOMContentLoaded", initPlayer);
  </script>

</body>
</html>
