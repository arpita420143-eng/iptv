<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MKS SPORTS - Premium Live</title>
    
    <!-- Premium App Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --bg-base: #0a0b10; /* Hotstar Deep Blue/Black */
            --bg-surface: #151720;
            --accent-blue: #0055ff;
            --accent-gold: linear-gradient(135deg, #f2c94c 0%, #f2994a 100%);
            --text-main: #ffffff;
            --text-dim: #8b92a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            background: linear-gradient(to bottom, #0d101a 0%, var(--bg-base) 100%);
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        /* --- 1. APP HEADER (Crucial for Premium Feel) --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon svg { width: 24px; height: 24px; fill: #fff; opacity: 0.8; }
        
        .app-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #a3c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .search-icon svg { width: 22px; height: 22px; fill: #fff; opacity: 0.8; }
        .profile-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0055ff, #00bfff);
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8rem; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);
        }

        /* --- 2. HERO PLAYER --- */
        .hero-player { width: 100%; position: relative; background: #000; box-shadow: 0 5px 25px rgba(0,0,0,0.5); }
        .player-overlay-top { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); z-index: 10; pointer-events: none; }
        .live-tag-container { position: absolute; top: 12px; left: 15px; z-index: 11; display: flex; align-items: center; gap: 8px; }
        .live-badge { background: #e50914; color: white; font-size: 0.65rem; font-weight: 800; padding: 3px 6px; border-radius: 4px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
        .live-badge::before { content: ''; width: 5px; height: 5px; background: white; border-radius: 50%; animation: pulse-dot 1s infinite alternate; }
        .view-count { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: white; font-size: 0.7rem; font-weight: 600; padding: 3px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }
        @keyframes pulse-dot { to { opacity: 0.3; transform: scale(0.8); } }
        
        /* Plyr Customizations */
        --plyr-color-main: var(--accent-blue);
        .plyr__controls { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%) !important; padding: 20px 10px 5px !important; }
        .plyr__control--overlaid { background: rgba(0, 0, 0, 0.5) !important; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2) !important; padding: 15px !important; }

        /* --- 3. CONTENT AREA --- */
        .content-area { padding: 15px; max-width: 1000px; margin: 0 auto; }
        
        .video-title { font-size: 1.3rem; font-weight: 700; line-height: 1.3; margin-bottom: 5px; color: #fff; }
        .video-tags { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag { background: rgba(255,255,255,0.1); font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; color: #ccc; font-weight: 500; }

        /* Action Bar */
        .action-bar { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .action-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-dim); font-size: 0.7rem; font-weight: 600; border: none; background: none; transition: 0.2s; }
        .action-btn:hover, .action-btn.active { color: var(--accent-blue); }
        .action-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* --- 4. PREMIUM VIP CARD --- */
        .vip-card {
            background: var(--bg-surface); border-radius: 10px; padding: 1px; 
            background-image: linear-gradient(var(--bg-surface), var(--bg-surface)), var(--accent-gold);
            background-origin: border-box; background-clip: padding-box, border-box; text-decoration: none; display: block;
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .vip-content { background: var(--bg-surface); border-radius: 9px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .vip-left { display: flex; flex-direction: column; gap: 3px; }
        .vip-title { color: #f2c94c; font-size: 1rem; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .vip-desc { color: var(--text-dim); font-size: 0.75rem; font-weight: 500; }
        .vip-btn { background: var(--accent-gold); color: #000; font-weight: 800; font-size: 0.8rem; padding: 8px 15px; border-radius: 20px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(242, 153, 74, 0.3); }

        /* --- 5. "MORE LIVE CHANNELS" SLIDER (The Secret to OTT Look) --- */
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .slider-container { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none; }
        .slider-container::-webkit-scrollbar { display: none; }
        
        .channel-card {
            min-width: 140px; border-radius: 8px; overflow: hidden; position: relative;
            background: #1a1d29; border: 1px solid rgba(255,255,255,0.05);
        }
        .channel-thumb {
            height: 80px; width: 100%; background: linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            display: flex; justify-content: center; align-items: center; font-weight: 800; color: rgba(255,255,255,0.5); font-size: 0.9rem;
        }
        .channel-thumb.c1 { background: linear-gradient(45deg, #141E30, #243B55); }
        .channel-thumb.c2 { background: linear-gradient(45deg, #4b134f, #c94b4b); }
        .channel-info { padding: 8px; }
        .channel-name { font-size: 0.75rem; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .channel-cat { font-size: 0.65rem; color: var(--text-dim); }

        /* Toast */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #fff; color: #000; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: 0.3s; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.3); white-space: nowrap;}
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

            </button>
            <button class="action-btn" onclick="shareStream()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>

    <div id="toast">Message</div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        // Viewer Count (50 - 400)
        let currentViewers = Math.floor(Math.random() * (400 - 50 + 1)) + 50;
        const viewCountEl = document.getElementById('view-count-text');
        viewCountEl.innerText = currentViewers;
        
        setInterval(() => {
            const change = Math.floor(Math.random() * 11) - 5; 
            currentViewers += change;
            if(currentViewers < 50) currentViewers = 55;
            if(currentViewers > 450) currentViewers = 400;
            viewCountEl.innerText = currentViewers;
        }, 5000);

        // Toast System
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Functional Buttons
        function toggleWatchlist(btn) {
            btn.classList.toggle('active');
            if(btn.classList.contains('active')) showToast("Added to Watchlist ✓");
            else showToast("Removed from Watchlist");
        }

        function shareStream() {
            if (navigator.share) {
                navigator.share({
                    title: 'MKS Sports Live',
                    text: 'Watch Live Match on MKS Sports App without buffering!',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast("Link copied to clipboard! 📋");
            }
        }

        function castStream() {
            showToast("Searching for nearby Cast devices... 🔍");
            setTimeout(() => { showToast("No supported devices found."); }, 3500);
        }

        // Video Player Setup
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            const playerConfig = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 1, 1.25, 1.5, 2] }
            };

            if (Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 600, enableWorker: true });
                hls.loadSource(source);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels.map(l => l.height);
                    availableQualities.unshift(0); 
                    playerConfig.quality = { default: 0, options: availableQualities, forced: true, onChange: (e) => updateQuality(e) };
                    new Plyr(video, playerConfig);
                });
                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                new Plyr(video, playerConfig);
            }

            function updateQuality(newQuality) {
                if (newQuality === 0) window.hls.currentLevel = -1; 
                else window.hls.levels.forEach((level, index) => { if (level.height === newQuality) window.hls.currentLevel = index; });
            }
        });
    </script>
