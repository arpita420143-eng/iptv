<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS sports Live</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
        }
        /* Bada Header Style */
        .header {
            text-align: center;
            padding: 40px 10px;
            background: linear-gradient(90deg, #0b2e59 0%, #155799 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 3px solid #ff9800;
        }
        .header h1 {
            margin: 0;
            font-size: 4rem; /* Naam bada dikhane ke liye */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }
        /* Video Container Layout */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px 15px;
        }
        .iframe-wrapper {
            flex: 1 1 45%;
            min-width: 320px;
            max-width: 800px;
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        /* Responsive iframe */
        .iframe-wrapper iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }
        /* Mobile ke liye adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.8rem;
            }
            .iframe-wrapper {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Bada Front Name -->
    <div class="header">
        <h1>MKS SPORTS</h1>
    </div>

    <!-- Live Streams -->
    <div class="video-container">
        <!-- Pehla Link -->
        <div class="iframe-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/7KW7ZN5A9cs" 
                title="MKS Sports Live 1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
        
        <!-- Dusra Link -->
        <div class="iframe-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/v6vTLS4MfCU" 
                title="MKS Sports Live 2" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
