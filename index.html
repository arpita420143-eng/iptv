<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>MKS Premium | FanCode Web</title>
    
    <!-- Player Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff6a00; --bg-dark: #0a0a0a; --card-bg: #141414; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); }
        
        /* Header */
        header { background: #000; padding: 15px 20px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .search-bar { padding: 8px 15px; border-radius: 20px; border: 1px solid #333; background: #111; color: #fff; outline: none; width: 250px; }
        
        /* Grid */
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Cards */
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: transform 0.2s, border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-img { width: 100%; height: 160px; object-fit: cover; border-bottom: 2px solid #222; }
        .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
        .live { background: #e50914; color: #fff; animation: pulse 2s infinite; }
        .upcoming { background: #ffaa00; color: #000; }
        .completed { background: #444; color: #fff; }
        .match-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; }
        .tour-name { font-size: 12px; color: #888; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Player Overlay */
        #playerOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .player-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); position: absolute; width: 100%; z-index: 10; }
        .close-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; backdrop-filter: blur(5px); }
        .close-btn:hover { background: #e50914; }
        #videoContainer { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .loader { border: 4px solid #222; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">MKS FANCODE</div>
        <input type="text" class="search-bar" id="searchInput" placeholder="Search matches..." onkeyup="filterMatches()">
    </header>

    <div class="container">
        <div id="loading" class="loader"></div>
        <div id="matchGrid" class="grid"></div>
    </div>

    <!-- Standalone Player Overlay -->
    <div id="playerOverlay">
        <div class="player-header">
            <h3 id="playingTitle" style="color: #fff; font-size: 16px; text-shadow: 1px 1px 3px #000;">Live Stream</h3>
            <button class="close-btn" onclick="closePlayer()">✖ CLOSE</button>
        </div>
        <div id="videoContainer">
            <video id="v" autoplay playsinline preload="auto"></video>
        </div>
    </div>

    <script>
        shaka.polyfill.installAll();
        const DATA_PROXY = "https://tv1.wapgotube.workers.dev/proxy/";
        
        const JSON_URL_1 = "https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.json"; // OLD
        const JSON_URL_2 = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json"; // WILLOW
        const JSON_URL_3 = "https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.json"; // NEW
        
        let allMatches = [];
        let player = null, ui = null, plyrInstance = null;

        // --- DATA FETCHING & MERGING ---
        async function fetchMatches() {
            try {
                const [res1, res2, res3] = await Promise.allSettled([
                    fetch(DATA_PROXY + JSON_URL_1).then(r => r.json()),
                    fetch(DATA_PROXY + JSON_URL_2).then(r => r.json()),
                    fetch(DATA_PROXY + JSON_URL_3).then(r => r.json())
                ]);

                const fancodeMap = new Map();

                // 1. Process Old FanCode
                if (res1.status === "fulfilled" && res1.value?.matches) {
                    res1.value.matches.forEach(m => {
                        fancodeMap.set(String(m.match_id), {
                            id: m.match_id,
                            title: m.title || `${m.team_1} vs ${m.team_2}`,
                            tournament: m.tournament || m.event_name || "Live Event",
                            status: m.status || "UPCOMING",
                            image: m.src || m.image || "https://via.placeholder.com/300x160?text=FanCode",
                            old_stream: { stream_url: m.stream_url, auto_streams: m.auto_streams },
                            new_stream: null
                        });
                    });
                }

                // 2. Process New FanCode (Merge if exists)
                if (res3.status === "fulfilled" && res3.value?.matches) {
                    res3.value.matches.forEach(m => {
                        const id = String(m.match_id);
                        const title = m.title || (m.team_1 ? `${m.team_1} vs ${m.team_2}` : "Live Match");
                        if (fancodeMap.has(id)) {
                            const existing = fancodeMap.get(id);
                            existing.new_stream = { stream_url: m.adfree_url || m.stream_url, auto_streams: m.auto_streams };
                            if(m.status) existing.status = m.status;
                            if(m.src || m.image) existing.image = m.src || m.image;
                        } else {
                            fancodeMap.set(id, {
                                id: id,
                                title: title,
                                tournament: m.tournament || m.event_name || "Live Event",
                                status: m.status || "LIVE",
                                image: m.src || m.image || "https://via.placeholder.com/300x160?text=FanCode",
                                old_stream: null,
                                new_stream: { stream_url: m.adfree_url || m.stream_url, auto_streams: m.auto_streams }
                            });
                        }
                    });
                }

                allMatches = Array.from(fancodeMap.values());

                // 3. Process Willow
                if (res2.status === "fulfilled" && res2.value?.Matches) {
                    res2.value.Matches.forEach(m => {
                        allMatches.push({
                            id: m.match_id,
                            title: m.title || "Willow Event",
                            tournament: m.synopsis || "Willow Cricket",
                            status: m.status || "LIVE",
                            image: m.cover_image || "https://via.placeholder.com/300x160?text=Willow+TV",
                            willow_url: m.url || m.stream_url
                        });
                    });
                }

                // Sort: LIVE first
                allMatches.sort((a, b) => (b.status === "LIVE" ? 1 : 0) - (a.status === "LIVE" ? 1 : 0));
                
                document.getElementById('loading').style.display = 'none';
                renderMatches(allMatches);

            } catch (err) {
                console.error("Error fetching data", err);
                document.getElementById('loading').innerHTML = "Failed to load matches.";
            }
        }

        // --- UI RENDERING ---
        function renderMatches(matches) {
            const grid = document.getElementById('matchGrid');
            grid.innerHTML = "";
            matches.forEach(m => {
                let statusClass = "upcoming";
                if(m.status.toUpperCase() === "LIVE") statusClass = "live";
                if(m.status.toUpperCase() === "COMPLETED") statusClass = "completed";

                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <img src="${m.image}" class="card-img" onerror="this.src='https://via.placeholder.com/300x160?text=Match'">
                    <div class="card-info">
                        <div>
                            <span class="status-badge ${statusClass}">${m.status}</span>
                            <div class="match-title">${m.title}</div>
                        </div>
                        <div class="tour-name">${m.tournament}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(m);
                grid.appendChild(card);
            });
        }

        function filterMatches() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMatches.filter(m => m.title.toLowerCase().includes(q) || m.tournament.toLowerCase().includes(q));
            renderMatches(filtered);
        }

        // --- PLAYER LOGIC (With Failsafe Engine) ---
        async function openPlayer(match) {
            document.getElementById('playingTitle').innerText = match.title;
            document.getElementById('playerOverlay').style.display = 'flex';
            
            if (match.willow_url) {
                // Direct Play for Willow
                await resetPlayerContainer();
                document.getElementById('v').src = match.willow_url;
                document.getElementById('v').play();
            } else {
                // Smart Fallback for FanCode
                await playFanCodeStreamsWithFallback(match);
            }
        }

        function closePlayer() {
            document.getElementById('playerOverlay').style.display = 'none';
            resetPlayerContainer(); // Destroy instances and stop audio
        }

        async function resetPlayerContainer() {
            if (plyrInstance) { plyrInstance.destroy(); plyrInstance = null; }
            if (ui) { await ui.destroy(); ui = null; }
            if (player) { await player.destroy(); player = null; }
            document.getElementById('videoContainer').innerHTML = `<video id="v" autoplay playsinline preload="auto"></video>`;
        }

        function getFanCodeQualityStreams(streamObj) {
            if (!streamObj) return [];
            const list = [];
            const autoStreams = streamObj.auto_streams;
            let streamsObj = Array.isArray(autoStreams) && autoStreams.length > 0 ? autoStreams[0] : (autoStreams || null);

            if (streamsObj) {
                Object.keys(streamsObj).forEach(key => {
                    const val = streamsObj[key];
                    if (typeof val === 'string') {
                        const urlMatch = val.match(/https?:\/\/[^\s"']+/);
                        if (urlMatch) {
                            let size = parseInt(key.replace(/\D/g, ''), 10) || (/high/i.test(key) ? 1080 : /med/i.test(key) ? 720 : 360);
                            list.push({ label: key, size: size, url: urlMatch[0].trim() });
                        }
                    }
                });
            }

            let baseAutoUrl = list.length > 0 ? list[0].url : (streamObj.stream_url || "");
            if (baseAutoUrl && list.length <= 1) {
                [{res: '1080p', size: 1080}, {res: '720p', size: 720}, {res: '480p', size: 480}].forEach(r => {
                    let genUrl = baseAutoUrl.replace(/(\d{3,4}p|auto|layer_\d+)/gi, r.res);
                    if (!list.some(item => item.size === r.size)) list.push({ label: r.res, size: r.size, url: genUrl });
                });
            }
            return list.sort((a, b) => b.size - a.size);
        }

        async function playFanCodeStreamsWithFallback(match) {
            const newQ = getFanCodeQualityStreams(match.new_stream);
            const oldQ = getFanCodeQualityStreams(match.old_stream);

            async function tryShaka(qualities) {
                if (!qualities || qualities.length === 0) throw new Error("No qualities");
                await resetPlayerContainer();
                const video = document.getElementById('v');
                player = new shaka.Player();
                await player.attach(video);
                ui = new shaka.ui.Overlay(player, document.getElementById('videoContainer'), video);
                ui.configure({ controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen'] });
                player.configure({ streaming: { bufferingGoal: 10, rebufferingGoal: 2 } });
                await player.load(qualities[0].url);
                video.play();
            }

            try {
                await tryShaka(newQ);
            } catch (e1) {
                console.warn("New stream failed, trying Old...");
                try {
                    await tryShaka(oldQ);
                } catch (e2) {
                    console.warn("Old stream failed, trying Plyr Fallback...");
                    const finalQ = newQ.length > 0 ? newQ : oldQ;
                    if (finalQ.length > 0) {
                        await resetPlayerContainer();
                        const video = document.getElementById('v');
                        video.src = finalQ[0].url;
                        plyrInstance = new Plyr(video, {
                            controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                            settings: ['quality'],
                            quality: { default: finalQ[0].size, options: finalQ.map(q => q.size), forced: true, onChange: (s) => { video.src = finalQ.find(q=>q.size===s).url; video.play(); } }
                        });
                        video.play();
                    }
                }
            }
        }

        // Initialize App
        fetchMatches();
    </script>
</body>
</html>
