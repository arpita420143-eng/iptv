<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple DASH Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:20px;">

  <h2>DASH Player</h2>
  
  <video id="video" controls autoplay style="width:100%; max-width:800px; background:#111;"></video>
  
  <p id="status" style="color:#aaa; font-family:monospace;"></p>

  <script>
    const STREAM_URL = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd";
    const CLEAR_KEYS = {
      "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b"
    };

    async function init() {
      const status = document.getElementById('status');
      const video = document.getElementById('video');

      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        status.innerText = 'Browser support nahi karta!';
        return;
      }

      const player = new shaka.Player(video);

      player.addEventListener('error', (e) => {
        status.innerText = 'Error: ' + JSON.stringify(e.detail);
      });

      player.configure({
        drm: { clearKeys: CLEAR_KEYS }
      });

      try {
        status.innerText = 'Loading stream...';
        await player.load(STREAM_URL);
        status.innerText = 'Stream Chal Rahi Hai!';
      } catch (e) {
        status.innerText = 'Load error: ' + e.message;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
