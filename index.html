<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS SPORTS - ULTIMATE STREAM</title>

    <!-- Sci-Fi & Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --brand-color: #00e5ff;
            --brand-glow: rgba(0, 229, 255, 0.6);
            --bg-color: #030407;
            --surface-color: rgba(10, 12, 20, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* --- 1. BOOT-UP SEQUENCE (NASA/HACKER FEEL) --- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Space Mono', monospace;
            color: var(--brand-color);
            transition: opacity 1s ease-out;
        }

        .boot-text {
            font-size: 1.2rem;
            text-align: left;
            width: 80%; max-width: 600px;
        }

        /* --- 2. CINEMATIC APP LAYOUT --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 10;
            opacity: 0; /* Hidden until boot finishes */
            animation: fadeIn 2s forwards 3.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Glassmorphism Navbar */
        nav {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }

        nav h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 15px var(--brand-glow);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: #ff0044;
            background: rgba(255, 0, 68, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff0044;
        }
        
        .live-indicator span {
            width: 10px; height: 10px;
            background: #ff0044;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        /* --- 3. AMBIENT PLAYER SECTION --- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 70px; /* Offset for navbar */
            position: relative;
        }

        /* The glowing cinematic background behind player */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 70%;
            background: radial-gradient(ellipse, rgba(0, 229, 255, 0.15) 0%, transparent 60%);
            filter: blur(80px);
            z-index: 0;
            animation: ambientPulse 4s infinite alternate;
        }

        @keyframes ambientPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .player-wrapper {
            position: relative;
            width: 85%;
            max-width: 1200px;
            z-index: 10;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            background: #000;
            overflow: hidden;
        }

        /* --- 4. NASA HUD (HEADS UP DISPLAY) INSIDE PLAYER --- */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* So it doesn't block video clicks */
            z-index: 5;
            padding: 20px;
            font-family: 'Space Mono', monospace;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        .hud-top-left { position: absolute; top: 20px; left: 20px; }
        .hud-top-right { position: absolute; top: 20px; right: 20px; text-align: right; }
        .hud-crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        .hud-crosshair::before, .hud-crosshair::after {
            content: ''; position: absolute; background: rgba(0, 229, 255, 0.1);
        }
        .hud-crosshair::before { width: 120px; height: 1px; }
        .hud-crosshair::after { width: 1px; height: 120px; }

        /* --- 5. NETFLIX STYLE PLYR OVERRIDES --- */
        --plyr-color-main: var(--brand-color);
        .plyr__controls {
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.9)) !important;
            padding: 40px 20px 20px 20px !important;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        .plyr__control--overlaid {
            background: rgba(0,0,0,0.5) !important;
            border: 2px solid var(--brand-color) !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5) !important;
            backdrop-filter: blur(5px);
        }

        /* --- 6. PREMIUM TELEGRAM WIDGET --- */
        .tg-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(10, 15, 25, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 229, 255, 0.1);
            z-index: 1000;
            width: 320px;
            transform: translateX(400px);
            animation: slideInTg 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 8s;
        }

        @keyframes slideInTg {
            to { transform: translateX(0); }
        }

        .tg-widget h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--brand-color);
            display: flex;
            justify-content: space-between;
        }
        
        .tg-widget p { font-size: 0.9rem; color: #aaa; margin-bottom: 15px; }
        
        .tg-btn {
            display: block;
            text-align: center;
            background: var(--brand-color);
            color: #000;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .tg-btn:hover { box-shadow: 0 0 15px var(--brand-color); }
        .close-tg { cursor: pointer; color: #fff; }

        @media (max-width: 768px) {
            .player-wrapper { width: 100%; border-radius: 0; }
            .tg-widget { bottom: 10px; right: 10px; left: 10px; width: auto; }
            nav h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- BOOT-UP HACKER SCREEN -->
    <div id="boot-screen">
        <div class="boot-text" id="terminal"></div>
    </div>

    <div class="app-container">
        <!-- APP NAVBAR -->
        <nav>
            <h1>MKS SPORTS</h1>
            <div class="live-indicator"><span></span> SAT-LINK: LIVE</div>
        </nav>

        <!-- MAIN PLAYER AREA -->
        <div class="main-content">
            <div class="ambient-glow"></div>
            
            <div class="player-wrapper">
                <!-- NASA/ISRO STYLE HUD OVERLAY -->
                <div class="hud-overlay">
                    <div class="hud-top-left">
                        SYS: MKS-ORBITAL-1<br>
                        LAT: 28.6139° N | LON: 77.2090° E<br>
                        BANDWIDTH: SECURE
                    </div>
                    <div class="hud-top-right">
                        [REC] <br>
                        UPLINK: ACTIVE<br>
                        PING: 12ms
                    </div>
                    <div class="hud-crosshair"></div>
                </div>

                <!-- THE VIDEO PLAYER -->
                <video id="player" controls crossorigin playsinline></video>
            </div>
        </div>

        <!-- TELEGRAM WIDGET -->
        <div class="tg-widget" id="tgWidget">
            <h3><span>PREMIUM ACCESS</span> <span class="close-tg" onclick="document.getElementById('tgWidget').style.display='none'">✖</span></h3>
            <p>Join MKS Sports command center on Telegram for 4K streams and backup servers.</p>
            <a href="https://t.me/MKSsports_3" target="_blank" class="tg-btn">CONNECT TO TELEGRAM</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // --- 1. BOOT-UP TERMINAL EFFECT ---
        const terminalText = [
            "> INITIALIZING MKS SPORTS PROTOCOL...",
            "> ESTABLISHING SECURE SATELLITE UPLINK...",
            "> BYPASSING GEO-RESTRICTIONS...",
            "> CONNECTING TO SERVER: OP-1...",
            "> DECRYPTING VIDEO STREAM...",
            "> LINK ESTABLISHED. WELCOME."
        ];
        
        let lineIndex = 0;
        const terminal = document.getElementById('terminal');

        function typeLine() {
            if (lineIndex < terminalText.length) {
                terminal.innerHTML += terminalText[lineIndex] + "<br>";
                lineIndex++;
                setTimeout(typeLine, 500); // Speed of typing
            } else {
                setTimeout(() => {
                    document.getElementById('boot-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 1000);
                }, 500);
            }
        }
        
        window.onload = typeLine;

        // --- 2. ADVANCED PLAYER SETUP ---
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            // Netflix style controls
            const playerConfig = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'live', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 1, 1.5, 2] }
            };

            // HLS for zero buffering
            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 60, // Deep buffer
                    maxMaxBufferLength: 1200,
                    enableWorker: true
                });
                
                hls.loadSource(source);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels.map((l) => l.height);
                    availableQualities.unshift(0); // 0 = Auto

                    playerConfig.quality = {
                        default: 0,
                        options: availableQualities,
                        forced: true,
                        onChange: (e) => updateQuality(e),
                    };

                    new Plyr(video, playerConfig);
                });

                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                new Plyr(video, playerConfig);
            }

            function updateQuality(newQuality) {
                if (newQuality === 0) {
                    window.hls.currentLevel = -1; 
                } else {
                    window.hls.levels.forEach((level, levelIndex) => {
                        if (level.height === newQuality) {
                            window.hls.currentLevel = levelIndex;
                        }
                    });
                }
            }
        });
    </script>

</body>
</html>
