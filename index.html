<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS sports - Premium Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: Arial, sans-serif;
        }

        video {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            object-fit: contain;
            outline: none;
        }

        /* Top Bar Overlay jisse items overlap nahi honge */
        .top-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            box-sizing: border-box;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        /* Premium MKS sports Logo */
        .brand-logo {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            /* Gold Gradient Effect */
            background: linear-gradient(90deg, #D4AF37, #FFF8DC, #D4AF37, #FFF8DC);
            background-size: 200% auto;
            color: #fff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.9));
            pointer-events: none; /* Click pass through */
            flex-shrink: 0;
        }

        /* Logo Shining Animation */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* Controls Container */
        .controls-container {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        /* Sleek Button Style */
        .custom-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .custom-btn:hover, .custom-btn:focus {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: #fff;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 600px) {
            .top-overlay {
                padding: 15px 10px;
            }
            .brand-logo {
                font-size: 18px; /* Choti screen par logo thoda chota */
            }
            .controls-container {
                gap: 8px;
            }
            .custom-btn {
                padding: 6px 10px;
                font-size: 12px; /* Buttons bhi thode chote */
            }
        }
    </style>
</head>
<body>

    <!-- Top Overlay: Logo & Buttons in Flex Container -->
    <div class="top-overlay">
        <!-- Premium Logo -->
        <div class="brand-logo">MKS sports</div>
        
        <!-- Controls -->
        <div class="controls-container">
            <button class="custom-btn" id="speedToggle">1x Speed</button>
            <button class="custom-btn" id="fsToggle">Fullscreen</button>
        </div>
    </div>

    <!-- Video Player -->
    <video id="mainPlayer" controls controlsList="nodownload" autoplay playsinline preload="auto">
        <source src="https://www.dropbox.com/scl/fi/rrrcccofgwdjdiv3606j1/Hanuman.Ansh.2026.720p.HDTC.Hindi.Clean.x264-HDHub4u.Ms.mkv?rlkey=up4bpgufl2zjgnkejpozolelo&st=abtn4k31&raw=1" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var player = document.getElementById("mainPlayer");
            var speedToggleBtn = document.getElementById("speedToggle");
            var fsToggleBtn = document.getElementById("fsToggle");
            
            player.volume = 1.0;
            
            // Speed change logic
            var speeds = [1, 1.25, 1.5, 2];
            var currentSpeedIndex = 0;

            speedToggleBtn.addEventListener("click", function() {
                currentSpeedIndex++;
                if (currentSpeedIndex >= speeds.length) {
                    currentSpeedIndex = 0;
                }
                var newSpeed = speeds[currentSpeedIndex];
                player.playbackRate = newSpeed;
                speedToggleBtn.innerText = newSpeed + "x Speed";
            });

            // Fullscreen Logic
            fsToggleBtn.addEventListener("click", function() {
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (player.webkitEnterFullscreen) {
                        // Special for iPhone/iPad Native Video Fullscreen
                        player.webkitEnterFullscreen();
                    }
                    fsToggleBtn.innerText = "Exit Full";
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    fsToggleBtn.innerText = "Fullscreen";
                }
            });
            
            // Handle Fullscreen UI Text Update 
            document.addEventListener("fullscreenchange", function() {
                if (!document.fullscreenElement) {
                    fsToggleBtn.innerText = "Fullscreen";
                }
            });
            
            // TV Remote Navigation 
            document.addEventListener("keydown", function(e) {
                switch(e.key) {
                    case "ArrowRight":
                        player.currentTime += 10;
                        break;
                    case "ArrowLeft":
                        player.currentTime -= 10;
                        break;
                    case "Enter":
                    case " ":
                        if(e.key === " ") e.preventDefault();
                        if (player.paused) {
                            player.play();
                        } else {
                            player.pause();
                        }
                        break;
                }
            });
            
            var playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Autoplay blocked. User tap required.");
                });
            }
        });
    </script>

</body>
</html>
