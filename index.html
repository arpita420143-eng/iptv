<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS SPORTS - Premium Live Stream</title>
    
    <!-- Google Fonts for Sci-Fi Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS (Premium Player UI) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        /* SCI-FI THEME CSS */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050510;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #111425 0%, #020205 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Sci-Fi Header */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 3rem;
            letter-spacing: 5px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-purple);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); }
            100% { text-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-blue), 0 0 50px var(--neon-blue); }
        }

        /* Player Container */
        .player-container {
            width: 90%;
            max-width: 1000px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(188, 19, 254, 0.2);
            background: #000;
            position: relative;
        }

        /* Customizing Plyr for Premium Look */
        --plyr-color-main: var(--neon-blue);
        --plyr-video-background: #000;
        
        /* Telegram Popup - Glassmorphism Sci-Fi */
        .tg-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .tg-popup {
            background: rgba(10, 15, 30, 0.7);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 40px var(--neon-purple), inset 0 0 20px var(--neon-blue);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8);
            animation: popIn 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        .tg-popup h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            margin-top: 0;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .tg-popup p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .tg-btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 0 20px var(--neon-purple);
            transition: all 0.3s ease;
        }

        .tg-btn:hover {
            box-shadow: 0 0 40px var(--neon-blue);
            transform: translateY(-3px);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            color: red;
            text-shadow: 0 0 10px red;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .player-container { width: 95%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MKS SPORTS</h1>
    </header>

    <div class="player-container">
        <!-- Video Element -->
        <video id="player" controls crossorigin playsinline></video>
    </div>

    <!-- Premium Telegram Popup -->
    <div class="tg-popup-overlay" id="popupOverlay">
        <div class="tg-popup">
            <span class="close-btn" onclick="closePopup()">✖</span>
            <h2>PREMIUM ACCESS</h2>
            <p>Join MKS Sports Official Telegram Channel for Premium Updates, Live Links & More!</p>
            <a href="https://t.me/MKSsports_3" target="_blank" class="tg-btn">JOIN TELEGRAM NOW</a>
        </div>
    </div>

    <!-- HLS.js (For streaming M3U8 files with quality support) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            // Plyr Options (Controls, Speed, Quality)
            const defaultOptions = {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
            };

            // Initialize HLS
            if (Hls.isSupported()) {
                const hls = new Hls({
                    // Tuning HLS for minimal buffering
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                });
                
                hls.loadSource(source);

                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    const availableQualities = hls.levels.map((l) => l.height);
                    availableQualities.unshift(0); // 0 means Auto Quality

                    defaultOptions.quality = {
                        default: 0,
                        options: availableQualities,
                        forced: true,
                        onChange: (e) => updateQuality(e),
                    };

                    // Initialize Plyr with HLS data
                    new Plyr(video, defaultOptions);
                });

                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For Safari (Native HLS support)
                video.src = source;
                new Plyr(video, defaultOptions);
            }

            // Function to change quality seamlessly
            function updateQuality(newQuality) {
                if (newQuality === 0) {
                    window.hls.currentLevel = -1; // -1 triggers Auto Quality
                } else {
                    window.hls.levels.forEach((level, levelIndex) => {
                        if (level.height === newQuality) {
                            window.hls.currentLevel = levelIndex;
                        }
                    });
                }
            }

            // Popup Logic - Shows after 5 seconds of page load
            setTimeout(() => {
                document.getElementById('popupOverlay').style.display = 'flex';
            }, 5000);
        });

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            // Optional: Auto play video when popup is closed
            // document.querySelector('video').play(); 
        }
    </script>

</body>
</html>
