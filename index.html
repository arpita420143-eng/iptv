<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MKS SPORTS - LIVE</title>

    <!-- Premium App Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --bg-base: #06070a; /* Deep OLED Black */
            --bg-surface: #12131a; /* Lighter surface for app feel */
            --accent-blue: #006aff; /* Hotstar Blue */
            --accent-gold: linear-gradient(135deg, #e6c875 0%, #b8860b 100%);
            --text-main: #ffffff;
            --text-dim: #8b92a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* --- 1. EDGE-TO-EDGE PLAYER CONTAINER --- */
        .hero-player {
            width: 100%;
            position: relative;
            background: #000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Overlay Gradients for Cinematic Look */
        .player-overlay-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 80px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10; pointer-events: none;
        }

        /* Top Left Live Badge (Inside Video) */
        .live-tag-container {
            position: absolute;
            top: 15px; left: 15px;
            z-index: 11;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background: #e50914; color: white; font-size: 0.7rem; font-weight: 800;
            padding: 4px 8px; border-radius: 4px; letter-spacing: 1px;
            display: flex; align-items: center; gap: 5px;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
        }
        .live-badge::before {
            content: ''; width: 6px; height: 6px; background: white; border-radius: 50%;
            animation: pulse-dot 1s infinite alternate;
        }

        .view-count {
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            color: white; font-size: 0.75rem; font-weight: 600;
            padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 5px;
        }

        @keyframes pulse-dot { to { opacity: 0.3; transform: scale(0.8); } }

        /* Plyr Customizations for Premium OTT Feel */
        --plyr-color-main: var(--accent-blue);
        .plyr__controls {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%) !important;
            padding: 30px 15px 10px !important;
        }
        .plyr__control--overlaid {
            background: rgba(0, 0, 0, 0.5) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2) !important;
            padding: 18px !important;
        }
        .plyr--full-ui input[type=range] {
            color: var(--accent-blue) !important;
        }

        /* --- 2. META DATA (App Style) --- */
        .content-area {
            padding: 20px 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .video-title {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .video-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
            margin-bottom: 15px;
        }

        /* --- 3. ACTION BAR (Share, Watchlist, etc.) --- */
        .action-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 20px;
        }

        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            color: var(--text-main); font-size: 0.75rem; font-weight: 600; cursor: pointer;
            opacity: 0.8; transition: 0.2s;
        }
        .action-btn:hover { opacity: 1; color: var(--accent-blue); }
        .action-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* --- 4. VIP GOLD SUBSCRIPTION CARD --- */
        .vip-card {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 2px; /* For gradient border */
            background-image: linear-gradient(var(--bg-surface), var(--bg-surface)), var(--accent-gold);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            text-decoration: none;
            display: block;
            box-shadow: 0 10px 30px rgba(184, 134, 11, 0.15);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .vip-card:active { transform: scale(0.98); }

        /* Shiny Sweep Animation on Card */
        .vip-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg); animation: shine 4s infinite;
        }
        @keyframes shine { 20% { left: 200%; } 100% { left: 200%; } }

        .vip-content {
            background: var(--bg-surface);
            border-radius: 10px;
            padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .vip-left { display: flex; flex-direction: column; gap: 4px; }
        
        .vip-title {
            color: #e6c875; font-size: 1.1rem; font-weight: 800; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px;
        }
        .vip-desc { color: var(--text-dim); font-size: 0.8rem; font-weight: 500; }

        .vip-btn {
            background: var(--accent-gold);
            color: #000; font-weight: 800; font-size: 0.85rem;
            padding: 10px 18px; border-radius: 20px; text-transform: uppercase;
        }

        /* Desktop specific tweaks */
        @media (min-width: 768px) {
            .hero-player { max-width: 1000px; margin: 20px auto; border-radius: 12px; overflow: hidden; }
            .content-area { padding: 20px 0; }
        }
    </style>
</head>
<body>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const source = 'https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/ts-eu-w1-n2/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8';
            
            const playerConfig = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 1, 1.25, 1.5, 2] }
            };

            if (Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 600, enableWorker: true });
                hls.loadSource(source);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels.map(l => l.height);
                    availableQualities.unshift(0); 
                    playerConfig.quality = { default: 0, options: availableQualities, forced: true, onChange: (e) => updateQuality(e) };
                    new Plyr(video, playerConfig);
                });

                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                new Plyr(video, playerConfig);
            }

            function updateQuality(newQuality) {
                if (newQuality === 0) window.hls.currentLevel = -1; 
                else window.hls.levels.forEach((level, index) => { if (level.height === newQuality) window.hls.currentLevel = index; });
            }
        });
    </script>
