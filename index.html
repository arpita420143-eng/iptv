<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKS sports Premium stream</title>
  <!-- Shaka Player compiled library & UI CSS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h2 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(246, 211, 101, 0.2);
    }
    .player-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    /* Ghoomne wala spinner/loader ko gayab karne ke liye */
    .shaka-spinner-container, .shaka-spinner {
      display: none !important;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <h2>MKS Sports Premium stream</h2>
    <!-- Shaka UI container -->
    <div data-shaka-player-container style="width: 100%; height: 100%;">
      <video data-shaka-player id="videoPlayer" autoplay></video>
    </div>
  </div>

  <script>
    const streamUrl = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd";
    
    const clearKeysConfig = {
      "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b"
    };

    async function initApp() {
      // Install polyfills
      shaka.polyfill.installAll();

      if (shaka.Player.isBrowserSupported()) {
        initPlayer();
      } else {
        console.error('Browser theek se support nahi kar raha hai!');
      }
    }

    async function initPlayer() {
      const video = document.getElementById('videoPlayer');
      const container = video.uiContainer;
      const player = video.getController().getPlayer();

      // Error listener
      player.addEventListener('error', (event) => {
        console.error('Error code', event.detail.code, event.detail);
      });

      // ClearKey DRM configuration set karna
      player.configure({
        drm: {
          clearKeys: clearKeysConfig
        }
      });

      try {
        await player.load(streamUrl);
        console.log('Stream successfully load ho gayi hai!');
      } catch (error) {
        console.error('Load karne me error aaya:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
