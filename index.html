<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS sports - Pro Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative; /* Button ko sahi jagah rakhne ke liye */
        }

        video {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            object-fit: contain;
            outline: none;
        }

        /* Custom Speed Button Style */
        .speed-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10; /* Video ke upar dikhne ke liye */
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        /* Hover karne par color change */
        .speed-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- controlsList="nodownload" se download button hat jayega -->
    <video id="mainPlayer" controls controlsList="nodownload" autoplay playsinline preload="auto">
        <source src="https://www.dropbox.com/scl/fi/rrrcccofgwdjdiv3606j1/Hanuman.Ansh.2026.720p.HDTC.Hindi.Clean.x264-HDHub4u.Ms.mkv?rlkey=up4bpgufl2zjgnkejpozolelo&st=abtn4k31&raw=1" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Custom Speed Control Button -->
    <button class="speed-btn" id="speedToggle">1x Speed</button>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var player = document.getElementById("mainPlayer");
            var speedToggleBtn = document.getElementById("speedToggle");
            
            player.volume = 1.0;
            
            // Speed change logic (1x -> 1.25x -> 1.5x -> 2x)
            var speeds = [1, 1.25, 1.5, 2];
            var currentSpeedIndex = 0;

            speedToggleBtn.addEventListener("click", function() {
                currentSpeedIndex++;
                if (currentSpeedIndex >= speeds.length) {
                    currentSpeedIndex = 0; // cycle wapas 1x par
                }
                var newSpeed = speeds[currentSpeedIndex];
                player.playbackRate = newSpeed;
                speedToggleBtn.innerText = newSpeed + "x Speed";
            });
            
            // Autoplay handle
            var playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Autoplay blocked. User needs to tap play.");
                });
            }
        });
    </script>

</body>
</html>
