<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKS sports</title>
  <!-- Shaka Player Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .player-container {
      width: 80%;
      max-width: 900px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <h2>Live DASH Stream Player</h2>
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <script>
    const streamUrl = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd";
    
    const clearKeysConfig = {
      "f3df7843080ae743bf865dc5fdf64c68": "567c863bc12eb74788ea74888c042e1b"
    };

    async function initApp() {
      // Browser polyfills install karna
      shaka.polyfill.installAll();

      if (shaka.Player.isBrowserSupported()) {
        initPlayer();
      } else {
        console.error('Browser theek se support nahi kar raha hai!');
      }
    }

    async function initPlayer() {
      const video = document.getElementById('videoPlayer');
      const player = new shaka.Player(video);

      // Error listener
      player.addEventListener('error', (event) => {
        console.error('Error code', event.detail.code, event.detail);
      });

      // ClearKey DRM configuration set karna
      player.configure({
        drm: {
          clearKeys: clearKeysConfig
        }
      });

      try {
        await player.load(streamUrl);
        console.log('Stream successfully load ho gayi hai!');
      } catch (error) {
        console.error('Load karne me error aaya:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
