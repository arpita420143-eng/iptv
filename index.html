  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  
  <style type="text/css">
      html, body {
        margin: 0; padding: 0; background-color: #0b0f19; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif;
      }
      .app-header {
        position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(11, 15, 25, 0.85);
        display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-weight: bold;
      }
      .video-container {
        position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 110px); background-color: #000000;
      }
      .shaka-video-container { position: absolute; width: 100%; height: 100%; }
      video { width: 100%; height: 100%; background-color: #000000; }

      /* Quality Buttons Bar at Bottom */
      .quality-bar {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
        background: #0b0f19; display: flex; align-items: center; justify-content: center;
        gap: 8px; z-index: 1000; overflow-x: auto; padding: 0 10px; box-sizing: border-box;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .quality-bar button {
        background: #1f293d; color: #fff; border: 1px solid rgba(255,255,255,0.2);
        padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
        white-space: nowrap; transition: 0.2s;
      }
      .quality-bar button.active, .quality-bar button:hover {
        background: #ef4444; border-color: #ef4444;
      }
  </style>
</head>
<body>

  </div>

  <div class="video-container">
    <div class="shaka-video-container" data-shaka-player>
      <video id="video" autoplay playsinline preload="auto"></video>
    </div>
  </div>

  <!-- Quality Switcher Buttons Bar -->
  <div class="quality-bar" id="qualityBar">
    <button onclick="switchQuality('https://in-mc-flive.fancode.com/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/1080p.m3u8?hdntl=Expires=1790852504~_GO=Generated~acl=/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/*~Signature=ARxeIm8_Bej2TYOU_Jp1JNHMLHux3GgNpdhWv2IXDod5UYxSqNUY4oMBJSpVa0T_cQZYl7aUx6rAYsQGKkA4eOB7DBoH', this)" class="active">1080p</button>
    <button onclick="switchQuality('https://in-mc-flive.fancode.com/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/720p.m3u8?hdntl=Expires=1790852504~_GO=Generated~acl=/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/*~Signature=ARxeIm8_Bej2TYOU_Jp1JNHMLHux3GgNpdhWv2IXDod5UYxSqNUY4oMBJSpVa0T_cQZYl7aUx6rAYsQGKkA4eOB7DBoH', this)">720p</button>

    <button onclick="switchQuality('https://in-mc-flive.fancode.com/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/240p.m3u8?hdntl=Expires=1790852504~_GO=Generated~acl=/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/*~Signature=ARxeIm8_Bej2TYOU_Jp1JNHMLHux3GgNpdhWv2IXDod5UYxSqNUY4oMBJSpVa0T_cQZYl7aUx6rAYsQGKkA4eOB7DBoH', this)">240p</button>
  </div>

  <script>
    let player = null;
    const video = document.getElementById('video');

    async function initializePlayer(url) {
      try {
        if (!player) {
          shaka.polyfill.installAll();
          player = new shaka.Player();
          await player.attach(video);

          const container = document.querySelector('.shaka-video-container');
          const ui = new shaka.ui.Overlay(player, container, video);
          
          ui.configure({
            'seekBarColors': { base: 'rgba(255,255,255,.2)', buffered: 'rgba(255,255,255,.4)', played: '#ef4444' }
          });

          player.configure({
            streaming: { bufferingGoal: 10, rebufferingGoal: 2, bufferBehind: 30, lowLatencyMode: true }
          });

          // Headers / Cookies filter jo tumhare player mein zaroori hai
          player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Referer'] = 'https://www.fancode.com/';
            request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)';
          });
        }

        await player.load(url);
        video.play().catch(e => console.log("Autoplay prevented"));
      } catch (error) {
        console.error('Error loading stream:', error);
      }
    }

    function switchQuality(url, btn) {
      // Active class button par change karein
      document.querySelectorAll('.quality-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Naya URL load karein bina player destroy kiye
      initializePlayer(url);
    }

    // Start with 1080p default
    document.addEventListener('DOMContentLoaded', () => {
      const defaultUrl = 'https://in-mc-flive.fancode.com/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/1080p.m3u8?hdntl=Expires=1790852504~_GO=Generated~acl=/mumbai/4249780_english_hls_fe7666272366793_1ta-di_h264/*~Signature=ARxeIm8_Bej2TYOU_Jp1JNHMLHux3GgNpdhWv2IXDod5UYxSqNUY4oMBJSpVa0T_cQZYl7aUx6rAYsQGKkA4eOB7DBoH';
      initializePlayer(defaultUrl);
    });
  </script>
</body>
</html>
